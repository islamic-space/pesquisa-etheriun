<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#0d3b12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8a951"/>
      <stop offset="100%" style="stop-color:#e8d48b"/>
    </linearGradient>
  </defs>

  <!-- Fundo: passaporte arredondado -->
  <rect x="56" y="32" width="400" height="448" rx="40" ry="40" fill="url(#bgGrad)"/>

  <!-- Borda interna decorativa -->
  <rect x="76" y="52" width="360" height="408" rx="28" ry="28"
        fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Padrão geométrico islâmico sutil (linhas decorativas no topo e base) -->
  <line x1="120" y1="80" x2="392" y2="80" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="432" x2="392" y2="432" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Arco decorativo (mihrab estilizado) no topo -->
  <path d="M 200 90 Q 256 60 312 90" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Crescente e estrela centrais -->
  <g transform="translate(256, 210)">
    <!-- Crescente -->
    <circle cx="0" cy="0" r="72" fill="url(#goldGrad)"/>
    <circle cx="22" cy="-14" r="58" fill="url(#bgGrad)"/>

    <!-- Estrela de 8 pontas (Rub el Hizb simplificada) -->
    <g transform="translate(40, -40)">
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6"
               fill="url(#goldGrad)"/>
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6"
               fill="url(#goldGrad)" transform="rotate(45)"/>
    </g>
  </g>

  <!-- Ícone de chip digital (representando blockchain/digital) -->
  <g transform="translate(256, 340)" stroke="url(#goldGrad)" fill="none" stroke-width="2.5" opacity="0.85">
    <rect x="-28" y="-20" width="56" height="40" rx="6" ry="6" fill="url(#goldGrad)" fill-opacity="0.15"/>
    <!-- Linhas do chip -->
    <line x1="-28" y1="-8" x2="-40" y2="-8"/>
    <line x1="-28" y1="8" x2="-40" y2="8"/>
    <line x1="28" y1="-8" x2="40" y2="-8"/>
    <line x1="28" y1="8" x2="40" y2="8"/>
    <line x1="-10" y1="-20" x2="-10" y2="-30"/>
    <line x1="10" y1="-20" x2="10" y2="-30"/>
    <line x1="-10" y1="20" x2="-10" y2="30"/>
    <line x1="10" y1="20" x2="10" y2="30"/>
    <!-- Circuito interno -->
    <rect x="-14" y="-8" width="28" height="16" rx="3" ry="3" stroke-width="1.5"/>
  </g>

  <!-- Texto: ISLAMIC PASSPORT -->
  <text x="256" y="410" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="28" font-weight="700" letter-spacing="4"
        fill="url(#goldGrad)">ISLAMIC</text>
  <text x="256" y="440" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="500" letter-spacing="6"
        fill="url(#goldGrad)" opacity="0.8">PASSPORT</text>
</svg>
